# Failover controller: nginx (TLS) -> controller -> PostgreSQL.
# Run it at the standby site (Site B) so it survives the loss of Site A.
#
#   cp .env.example .env    # then fill it in
#   ./gen-self-signed-cert.sh failover.internal   # or copy real certs into ./certs
#   docker compose up -d --build

name: failover-controller

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: failover
      POSTGRES_DB: failover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failover -d failover"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  server:
    build: { context: .., target: server }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://failover:${POSTGRES_PASSWORD}@postgres:5432/failover
      FSM_TRUST_PROXY: "true"
      FSM_COOKIE_SECURE: "true"
      FSM_PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
    # Needs outbound access to Proxmox, NPM, Cloudflare and the apps, so it is
    # also on the default network. Restrict destinations with FSM_EGRESS_ALLOWLIST.
    networks: [backend, default]
    stop_grace_period: 5m
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    ports:
      - "${FSM_HTTPS_PORT:-443}:443"
      - "${FSM_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on: [server]
    networks: [backend, default]

volumes:
  pgdata:

networks:
  backend:
    internal: true
